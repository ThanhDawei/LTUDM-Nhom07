# ===================================================================
# QUIZZLIVE SERVER CONFIGURATION - NHÓM 07: TRANH TÀI KIẾN THỨC
# ===================================================================

# 1. Network Socket Server
server.port=8888
server.thread-pool-size=50

# 2. SSL/TLS Encryption
server.ssl.enabled=false
server.ssl.key-store-path=server.keystore
server.ssl.key-store-password=changeit

# 3. Database Settings (Default: MySQL. Fallback: H2 Embedded)
# If using MySQL (Local XAMPP / Laragon / Docker):
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/quizzlive_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.username=root
db.password=

# Set to true to automatically execute schema.sql and seed_data.sql when server boots
db.auto-init=true

# 4. Game Match Rules (Requirement 5, 13)
match.default-question-count=5
match.default-time-per-question=10
match.base-score=100
match.speed-bonus-enabled=true

# 5. Matchmaking Settings (Requirement 2)
matchmaking.timeout-seconds=60
